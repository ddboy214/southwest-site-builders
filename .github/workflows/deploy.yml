name: Keep GitHub Pages static fallback updated

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify static fallback files
        run: |
          test -s public/index.html
          test -s public/404.html
          test -s public/style.css
          test -s public/script.js
          test -s public/portfolio/shared-style.css
          test -s public/portfolio/shared-script.js

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy static fallback to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
