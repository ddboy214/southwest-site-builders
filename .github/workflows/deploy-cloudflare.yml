name: Test and deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "migrations/**"
      - "test/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "src/**"
      - "migrations/**"
      - "test/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  test:
    name: Test Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  deploy:
    name: Deploy Worker and D1
    # Keep deployment disabled until D1 and the required repository secrets are configured.
    if: ${{ github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN GitHub secret." >&2; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub secret." >&2; exit 1)
          test "${#ADMIN_TOKEN}" -ge 32 || (echo "ADMIN_TOKEN must be at least 32 characters." >&2; exit 1)
          node -e 'const fs=require("fs"); const config=fs.readFileSync("wrangler.jsonc", "utf8"); if (config.includes("00000000-0000-0000-0000-000000000000")) { console.error("Create the D1 database and update database_id in wrangler.jsonc before deploying."); process.exit(1); }'

      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and update administrator secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: deploy
          secrets: |
            ADMIN_TOKEN
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
